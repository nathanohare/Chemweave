name: iPad app

# The iPad app: the same web page as the desktop app, in Tauri's iOS shell.
#
# Runs on a merge into main, or on request (Actions > iPad app > Run workflow), so pull
# requests aren't held up waiting for a Mac. It checks the shell builds for iOS,
# makes the Xcode project, then builds the signed app and sends it to TestFlight once the Apple
# secrets are set (docs/apple-signing.md). Without them the signed steps are skipped.
#
# A pull request that changes this workflow runs it too, as a try-out: everything up to the Xcode
# project, never signed or sent to TestFlight (2026-11-24). Only main is sent to TestFlight: a run
# started by hand on another branch is a try-out too, and on main it can skip TestFlight by
# unticking "Send to TestFlight".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ship:
        description: Send to TestFlight (when the Apple secrets are set)
        type: boolean
        default: true
  pull_request:
    paths: [.github/workflows/ios.yml, scripts/release.mjs, scripts/retry.mjs]

# a new push to a pull request stops the try-out still going for its previous commit
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the token only reads the code (none of these steps writes to the repository)
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The iPad version stays the same from build to build, and only the build number goes up, so
      # TestFlight's outside testers get each new build without another Beta App Review. Raise
      # VERSION by hand for a new round of review (or for the App Store). It started above the
      # 0.1.<run> numbers the first uploads used, because App Store Connect refuses a lower one.
      VERSION: 0.2.0
      BUILD: ${{ github.run_number }}
      # TestFlight uploads also wait for the repository variable TESTFLIGHT = on, and happen only
      # from main: never from a pull request, another branch, or a run with "Send to TestFlight"
      # unticked (inputs.ship is empty on a push, hence the event check before it)
      SHIP: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_MOBILE_PROVISION != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' && vars.TESTFLIGHT == 'on' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.ship) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios
      - name: Use the newest released Xcode on the Mac
        # App Store Connect wants apps built with the newest iOS SDK (from April 2027, the iOS 27
        # SDK in Xcode 27 or later). macos-latest doesn't always default to the newest Xcode, so
        # pick the highest released one installed (betas and release candidates are refused for
        # uploads, so they are skipped); without one, the default stays.
        run: |
          pick=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2)
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci
      - run: brew install xcodegen
      - name: Number this version
        run: |
          node scripts/release.mjs prepare "$VERSION" false
          # the build number (CFBundleVersion), which TestFlight needs to go up each upload
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.iOS={...c.bundle.iOS,bundleVersion:process.env.BUILD};fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"
          echo "iPad version $VERSION, build $BUILD"
      - name: Check the shell builds for iOS
        working-directory: src-tauri
        run: cargo build --lib --target aarch64-apple-ios
      - name: Make the Xcode project
        env:
          # a stand-in Team ID until the real one is in the secrets (enough to check the project)
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || '0000000000' }}
        run: |
          npx tauri ios init --ci
          # iPad only (not iPhone): the drawing needs the room
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 2/g' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY: "1,2"/TARGETED_DEVICE_FAMILY: "2"/g' src-tauri/gen/apple/project.yml || true
          # the privacy manifest goes in beside the app's Info.plist
          cp src-tauri/ios/PrivacyInfo.xcprivacy src-tauri/gen/apple/*_iOS/
          # the app icons for iPad: the desktop picture filling the square (iPadOS rounds the
          # corners), with no transparency, which App Store Connect refuses
          npx tauri icon src-tauri/icons/ios-icon.png --ios-color '#09323e'
          for f in src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/*.png; do
            if sips -g hasAlpha "$f" | grep -q 'hasAlpha: yes'; then
              sips -s format jpeg "$f" --out "$RUNNER_TEMP/flat.jpg" >/dev/null
              sips -s format png "$RUNNER_TEMP/flat.jpg" --out "$f" >/dev/null
            fi
          done
          ls src-tauri/gen/apple
      - name: Build the signed app
        if: env.SHIP == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: npx tauri ios build --export-method app-store-connect
      - name: Send it to TestFlight
        if: env.SHIP == 'true'
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/"AuthKey_$API_KEY_ID.p8"
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          echo "Uploading $ipa"
          # App Store Connect is an outside service: scripts/retry.mjs tries again if it refuses
          node scripts/retry.mjs -- xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - name: Say what was skipped
        if: env.SHIP != 'true'
        run: |
          echo "Not signed or sent to TestFlight: this is a pull request, a branch other than main, a run with \"Send to TestFlight\" unticked, or the Apple secrets or the TESTFLIGHT = on variable are not set yet (docs/apple-signing.md)."
