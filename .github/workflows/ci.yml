name: Checks

# Runs on every pull request. Not on pushes to main: everything reaches main through a pull
# request (feature -> staging -> main), and that pull request's checks already ran on the merged
# code. The Desktop app and Web version workflows still build each merge into main.
on:
  pull_request:
  workflow_dispatch:

# the token only reads the code and the pull request's file list (nothing here writes)
permissions:
  contents: read
  pull-requests: read

# A new push to a pull request stops the run still going for its previous commit
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the unit tests, split in two halves that run side by side (each about 1.5 min instead of 3).
  # They include the UI text check (tests/ui-text-lint.test.ts, scripts/lint-ui-text.mjs), the
  # field round trip through every format (tests/field-round-trip.test.ts), open-save-compare
  # (tests/open-save-compare.test.ts), the places that must stay in step (tests/parity.test.ts)
  # and the undo audit's lists (tests/undo-every-command.test.ts; the audit itself runs as a quick
  # sweep in the build job, and in full by hand: docs/developers.md).
  tests:
    name: tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # also makes the icon data and copies RDKit (package.json's postinstall)
      - run: npm ci
      # the ECMA-376 schemas the Office samplers' files are checked against (tests/ooxml-schema.ts),
      # downloaded from Ecma rather than kept in the repository (scripts/fetch-ooxml-schemas.mjs)
      - uses: actions/cache@v6
        with:
          path: .cache/ooxml-schemas
          key: ooxml-schemas-${{ hashFiles('scripts/fetch-ooxml-schemas.mjs') }}
      - run: node scripts/retry.mjs -- node scripts/fetch-ooxml-schemas.mjs
      # with the schemas required, a missing download fails here instead of skipping the check
      - run: npx vitest run --shard=${{ matrix.shard }}/2
        env:
          OOXML_SCHEMAS_REQUIRED: '1'

  # type checks, the web build, then the built app in a real browser: start, draw, paste, save and
  # reopen, every kind of tab, menus that fit a laptop's window (scripts/smoke.mjs), and axe with a
  # keyboard-only walk in Light and Dark Gray (scripts/a11y-check.mjs, known problems in
  # scripts/a11y-known.mjs)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsconfig.strict.json is tsconfig.json plus extra checks, so this covers the type check
      # `npm run build` does as well; the build step below is then only Vite's
      - run: npm run typecheck:strict
      - run: npm run typecheck:tests
      - run: npx vite build
      # Playwright's headless Chromium is all the smoke test needs (not the full browser)
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run smoke
      # the quick undo sweep (standing rule R7): one slice of the commands in each kind of tab, the
      # slice changing each day; it first checks that it catches a planted two-step command and a
      # planted missing undo. A failure prints its slice: `npm run undo-audit -- ci --slice k/16`.
      - run: npm run undo-audit -- ci

  # the work behind each mode (bench/core.bench.ts), timed for this pull request and for the branch
  # it merges into on the same machine: fails when a measure gets more than 40% slower. Skipped
  # when the pull request changes only the guide, tests or other text that can't change the timings.
  speed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: See whether the pull request changes code
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          if grep -qvE '^(docs/|tests/|[^/]+\.md$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$)' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only the guide, tests or text changed: nothing to time."
          fi
      - if: steps.changed.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          path: head
      - if: steps.changed.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ github.event.pull_request.base.ref }}
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: head/package-lock.json
      - if: steps.changed.outputs.code == 'true'
        run: (cd head && npm ci) && (cd base && npm ci)
      # both are timed with this pull request's benchmarks
      - if: steps.changed.outputs.code == 'true'
        run: cp head/bench/core.bench.ts base/bench/core.bench.ts
      # twice each, taking turns, so a slow moment on the machine doesn't count against one side
      - if: steps.changed.outputs.code == 'true'
        run: |
          for n in 1 2; do
            (cd base && npx vitest bench --run bench/core.bench.ts --outputJson ../base$n.json > /dev/null)
            (cd head && npx vitest bench --run bench/core.bench.ts --outputJson ../head$n.json > /dev/null)
          done
      - if: steps.changed.outputs.code == 'true'
        run: node head/scripts/bench-gate.mjs base1.json,base2.json head1.json,head2.json
      # start-up: both versions built and served, then started in turns in a real browser
      # (scripts/startup-gate.mjs fails when this pull request's app takes 25% and 100 ms longer to be up)
      - if: steps.changed.outputs.code == 'true'
        run: (cd head && npx vite build > /dev/null) && (cd base && npx vite build > /dev/null)
      - if: steps.changed.outputs.code == 'true'
        run: cd head && npx playwright install --with-deps --only-shell chromium
      - if: steps.changed.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          (cd base && npx vite preview --port 4174 --strictPort > /dev/null 2>&1 &)
          (cd head && npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &)
          for p in 4173 4174; do timeout 60 bash -c "until curl -sf http://localhost:$p/ > /dev/null; do sleep 1; done" || { echo "The $([ $p = 4174 ] && echo "base branch's" || echo "pull request's") built app did not start on port $p."; exit 1; }; done
          # an expected slowdown passes with the label "slower start-up expected" (read now, so a re-run sees a label added later)
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name' | grep -qx 'slower start-up expected'; then export STARTUP_SLOWER_OK=true; fi
          cd head && node scripts/startup-gate.mjs http://localhost:4174/ http://localhost:4173/
      # redraw: dragging in a big drawing, both versions in turns (scripts/redraw-gate.mjs fails a
      # redraw over its budget in bench/redraw.mjs, or 40% slower than the base branch)
      - if: steps.changed.outputs.code == 'true'
        run: cd head && node scripts/redraw-gate.mjs http://localhost:4174/ http://localhost:4173/
