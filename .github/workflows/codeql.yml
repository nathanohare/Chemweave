name: CodeQL

# Code scanning on pushes to main, on the staging-to-main pull request (so
# alerts show before the merge; Nate, 2026-11-26), once a week and by hand.
# Pull requests into staging, other pull requests into main, and pushes to
# staging or feature branches skip it (Nate, 2026-11-25).
# This replaces GitHub's CodeQL "default setup", which also ran on every
# pull request into main. Default setup must be off (Settings > Code security
# > CodeQL analysis > Switch to advanced) or GitHub rejects these results.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # (a pull request into main is scanned only when it comes from staging)
    if: github.event_name != 'pull_request' || github.head_ref == 'staging'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # the same languages default setup scanned, none of which need a build
        language: [actions, javascript-typescript, python, rust, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
