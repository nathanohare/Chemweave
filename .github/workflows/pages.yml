name: Web version

# Publishes the browser version of the app to GitHub Pages
# (https://nathanohare.github.io/Chemweave/) when something is merged into main, or on
# request (Actions > Web version > Run workflow). Free while the repository is public.
#
# A pull request that changes this workflow or the script it runs builds the web version here
# without publishing it, and so does a run started by hand on any branch but main: a workflow
# change is tried before it reaches main, not first on a real deploy (#699, 2026-11-24).
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/pages.yml, scripts/strip-nmr-data.mjs]

# the build only reads the code; the deploy job asks for what publishing needs
permissions:
  contents: read

# Only the newest merge is published; an older run still going is cancelled. Try-out builds of
# other branches and pull requests have a group each, so they never cancel a deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs, as in GitHub's own Pages workflow. In one job the deploy
  # step can ask for the artifact before GitHub lists it ("No artifacts named github-pages were
  # found", 2026-11-24); a second job starts only after the upload is finished and listed.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # NMR prediction is desktop only: leave its data out of the browser version
      - run: node scripts/strip-nmr-data.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # only main is published; other runs stop after the build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
